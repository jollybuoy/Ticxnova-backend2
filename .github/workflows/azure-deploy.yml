name: Deploy Node.js Backend to Azure Web App

on:
  workflow_dispatch:  # ✅ Manual trigger only

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Zip backend code
        run: zip -r release.zip .

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Optional: Stop App Service before deploy (uncomment if needed)
      # - name: Stop App Service
      #   run: az webapp stop --name ticxnova --resource-group <your-resource-group>

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ticxnova
          package: release.zip
          cleanup: true  # ✅ Prevent conflict errors

      # Optional: Start App Service after deploy
      # - name: Start App Service
      #   run: az webapp start --name ticxnova --resource-group <your-resource-group>
