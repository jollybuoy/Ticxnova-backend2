# GitHub Actions Workflow to Deploy Ticxnova Backend to Azure Web App
# Docs: https://github.com/Azure/webapps-deploy

name: Build and Deploy Node.js App to Azure Web App - Ticxnova

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install Dependencies & Run Tests
        run: |
          npm install
          npm run test --if-present

      - name: Zip Backend for Deployment
        run: zip -r release.zip . -x '*.git*' 'node_modules/*'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticxnova-backend
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ticxnova-backend

      - name: Unzip Artifact
        run: unzip release.zip

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_848F964D07714F93A7BDA3E33CE4F9CC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1F30AE2419274EA685BBE7AFE7197A4A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BC1EE839CEDB464E8E3A89A869C4CB2C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Ticxnova'
          slot-name: 'Production'
          package: .
          cleanup: true  # ✅ Ensures deployment conflicts are avoided
